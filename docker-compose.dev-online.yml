# =============================================================================
# RD Mídia Indoor — STACK "DEV ONLINE" (Portainer → Stack via repositório Git) — AÇÃO 005
# -----------------------------------------------------------------------------
# Ambiente de DESENVOLVIMENTO publicado na internet (VPS de testes):
#   - imagens CONSTRUÍDAS do código do repositório a cada deploy (pull_policy: build);
#     não usa registro nem imagem versionada (isso é o fluxo das instâncias de release);
#   - ENVIRONMENT=development: provedor de pagamento FALSO (MOCK_PAYMENT), OpenAPI só
#     na origem da API, e-mails capturados pelo Mailpit; demais regras iguais às de
#     produção (cookie Secure, segredos como Docker secrets, banco/redis sem porta);
#   - TLS na borda COMPARTILHADA da VPS (Traefik, ops/edge/docker-compose.edge.yml):
#     este nginx não publica porta; entra na rede externa ${RD_EDGE_NETWORK}.
#
# Fica na RAIZ do repositório de propósito: os contextos de build (./backend, ./frontend…)
# resolvem igual com ou sem --project-directory (Portainer clona o repositório inteiro).
#
# Variáveis da stack: ops/portainer/dev-online.env.example. Segredos: arquivos em
# ${RD_SECRETS_DIR} (ops/dev/generate-secrets.sh). Procedimento: ops/README.md §12.
# Validar sem subir:
#   docker compose -f docker-compose.dev-online.yml --env-file <instancia>.env config -q
# =============================================================================

name: ${RD_INSTANCE:?defina RD_INSTANCE (igual ao nome da stack no Portainer)}

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

x-backend-build: &backend-build
  context: ./backend
  target: production

x-backend-image: &backend-image rd-midiaindoor/backend:${RD_INSTANCE}

x-backend-env: &backend-env
  ENVIRONMENT: development
  PYTHONUNBUFFERED: "1"
  DEBUG: "false"
  MOCK_PAYMENT: "true"
  OPENAPI_ENABLED: "true"
  COOKIE_SECURE: "true"
  LOG_JSON: "true"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${RD_DB_NAME:-rdmidiaindoor}
  POSTGRES_USER: rd_app
  POSTGRES_PASSWORD_FILE: /run/secrets/db_app_password
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  SECRET_KEY_FILE: /run/secrets/app_secret_key
  JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
  DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key
  # Provedor FALSO (MOCK_PAYMENT) também assina/valida webhooks: sem este segredo a
  # simulação de pagamento responde 503 WEBHOOK_SECRET_NOT_CONFIGURED.
  CLOUDPAYPAG_WEBHOOK_SECRET_FILE: /run/secrets/cloudpaypag_webhook_secret
  # E-mails (convites, códigos, alertas) ficam no Mailpit desta instância (§12).
  EMAIL_BACKEND: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_FROM: RD Mídia Indoor (DEV) <nao-responder@${RD_PANEL_DOMAIN:?defina RD_PANEL_DOMAIN}>
  FRONTEND_URL: https://${RD_PANEL_DOMAIN}
  PANEL_BASE_URL: https://${RD_PANEL_DOMAIN}
  CORS_ORIGINS: https://${RD_PANEL_DOMAIN},https://${RD_PLAYER_DOMAIN:?defina RD_PLAYER_DOMAIN}
  PLAYER_ALLOWED_ORIGINS: ${RD_PLAYER_ALLOWED_ORIGINS:?defina RD_PLAYER_ALLOWED_ORIGINS - origens https do player separadas por virgula}
  ALLOWED_HOSTS: ${RD_PANEL_DOMAIN},${RD_API_DOMAIN:?defina RD_API_DOMAIN},${RD_PLAYER_DOMAIN}
  RD_INSTANCE_SLUG: ${RD_INSTANCE_SLUG:?defina RD_INSTANCE_SLUG - minusculas, numeros e hifen}
  MANIFEST_SIGNING_KEY_FILE: /run/secrets/manifest_signing_key
  PLAYER_RELEASE_PUBLIC_KEYS_FILE: /run/configs/player_release_public_keys.json
  PROMETHEUS_ENABLED: "true"
  STORAGE_PROVIDER: local
  STORAGE_LOCAL_PATH: /app/media

x-backend-secrets: &backend-secrets
  - db_app_password
  - redis_password
  - app_secret_key
  - jwt_secret_key
  - data_encryption_key
  - cloudpaypag_webhook_secret
  - manifest_signing_key

x-backend-configs: &backend-configs
  - source: player_release_public_keys
    target: /run/configs/player_release_public_keys.json

x-dbtools: &dbtools
  build:
    context: ./ops
    dockerfile: dbtools/Dockerfile
  image: rd-midiaindoor/dbtools:${RD_INSTANCE}
  pull_policy: build

networks:
  # Borda compartilhada da VPS (Traefik) — criada pela stack ops/edge.
  rd-edge:
    name: ${RD_EDGE_NETWORK:-rd-edge}
    external: true
  # Portas publicadas SÓ em 127.0.0.1 (Grafana, Mailpit) — acesso por túnel SSH.
  local:
    driver: bridge
  internal:
    driver: bridge
    internal: true          # sem rota para fora: banco/redis/observabilidade isolados
  egress:
    driver: bridge          # saída controlada (cópia externa de backup etc.)

volumes:
  postgres-data:
  redis-data:
  media-storage:
  db-backups:
  mailpit-data:
  prometheus-data:
  alertmanager-data:
  loki-data:
  promtail-positions:
  grafana-data:

secrets:
  postgres_superuser_password:
    file: ${RD_SECRETS_DIR:?defina RD_SECRETS_DIR}/postgres_superuser_password
  db_owner_password:
    file: ${RD_SECRETS_DIR}/db_owner_password
  db_app_password:
    file: ${RD_SECRETS_DIR}/db_app_password
  db_backup_password:
    file: ${RD_SECRETS_DIR}/db_backup_password
  redis_password:
    file: ${RD_SECRETS_DIR}/redis_password
  app_secret_key:
    file: ${RD_SECRETS_DIR}/app_secret_key
  jwt_secret_key:
    file: ${RD_SECRETS_DIR}/jwt_secret_key
  data_encryption_key:
    file: ${RD_SECRETS_DIR}/data_encryption_key
  backup_passphrase:
    file: ${RD_SECRETS_DIR}/backup_passphrase
  grafana_admin_password:
    file: ${RD_SECRETS_DIR}/grafana_admin_password
  manifest_signing_key:
    file: ${RD_SECRETS_DIR}/manifest_signing_key
  # Gerado para a instância DEV (64 alfanuméricos) — não é credencial do CloudPayPag real.
  cloudpaypag_webhook_secret:
    file: ${RD_SECRETS_DIR}/cloudpaypag_webhook_secret
  bootstrap_master_password:
    file: ${RD_SECRETS_DIR}/bootstrap_master_password

configs:
  player_release_public_keys:
    file: ${RD_CONFIG_DIR:?defina RD_CONFIG_DIR}/player_release_public_keys.json
  alertmanager_config:
    file: ${RD_CONFIG_DIR}/alertmanager.yml

services:

  # ─── BORDA DA INSTÂNCIA: headers, rate limit, roteamento (TLS no Traefik) ───
  nginx:
    build:
      context: ./nginx
    image: rd-midiaindoor/nginx:${RD_INSTANCE}
    pull_policy: build
    restart: unless-stopped
    environment:
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/templates-proxied
      RD_PANEL_DOMAIN: ${RD_PANEL_DOMAIN}
      RD_API_DOMAIN: ${RD_API_DOMAIN}
      RD_PLAYER_DOMAIN: ${RD_PLAYER_DOMAIN}
      RD_TRUSTED_PROXY_CIDR: ${RD_TRUSTED_PROXY_CIDR:-10.250.0.2/32}
    depends_on:
      - backend
      - frontend
      - player-web
    networks:
      - rd-edge
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${RD_EDGE_NETWORK:-rd-edge}"
      - "traefik.http.services.${RD_INSTANCE}.loadbalancer.server.port=80"
      - "traefik.http.routers.${RD_INSTANCE}-panel.rule=Host(`${RD_PANEL_DOMAIN}`)"
      - "traefik.http.routers.${RD_INSTANCE}-panel.entrypoints=websecure"
      - "traefik.http.routers.${RD_INSTANCE}-panel.tls.certresolver=le"
      - "traefik.http.routers.${RD_INSTANCE}-panel.service=${RD_INSTANCE}"
      - "traefik.http.routers.${RD_INSTANCE}-api.rule=Host(`${RD_API_DOMAIN}`)"
      - "traefik.http.routers.${RD_INSTANCE}-api.entrypoints=websecure"
      - "traefik.http.routers.${RD_INSTANCE}-api.tls.certresolver=le"
      - "traefik.http.routers.${RD_INSTANCE}-api.service=${RD_INSTANCE}"
      - "traefik.http.routers.${RD_INSTANCE}-player.rule=Host(`${RD_PLAYER_DOMAIN}`)"
      - "traefik.http.routers.${RD_INSTANCE}-player.entrypoints=websecure"
      - "traefik.http.routers.${RD_INSTANCE}-player.tls.certresolver=le"
      - "traefik.http.routers.${RD_INSTANCE}-player.service=${RD_INSTANCE}"
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  frontend:
    build:
      context: ./frontend
      target: production
    image: rd-midiaindoor/frontend:${RD_INSTANCE}
    pull_policy: build
    restart: unless-stopped
    networks:
      - internal
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  player-web:
    build:
      context: ./player-web
      target: production
    image: rd-midiaindoor/player-web:${RD_INSTANCE}
    pull_policy: build
    restart: unless-stopped
    networks:
      - internal
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # ─── One-shots: papéis do banco → migrations → bootstrap da instância ───────
  migrate:
    build: *backend-build
    image: *backend-image
    pull_policy: build
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-env
      POSTGRES_USER: rd_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
      MANIFEST_SIGNING_KEY_FILE: ""
      PLAYER_RELEASE_PUBLIC_KEYS_FILE: ""
    secrets:
      - db_owner_password
      - redis_password
      - app_secret_key
      - jwt_secret_key
      - data_encryption_key
      - cloudpaypag_webhook_secret
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - internal
    logging: *default-logging

  bootstrap:
    build: *backend-build
    image: *backend-image
    pull_policy: build
    restart: "no"
    command: ["python", "-m", "app.cli", "bootstrap-instance"]
    environment:
      <<: *backend-env
      MANIFEST_SIGNING_KEY_FILE: ""
      PLAYER_RELEASE_PUBLIC_KEYS_FILE: ""
      # Lidos SÓ na 1ª inicialização (ops/README.md §4.3); ausentes ficam ausentes.
      RD_BOOTSTRAP_DUAL_MASTER_APPROVAL: ${RD_BOOTSTRAP_DUAL_MASTER_APPROVAL:-}
      RD_BOOTSTRAP_MASTER_EMAIL: ${RD_BOOTSTRAP_MASTER_EMAIL:-}
      RD_BOOTSTRAP_MASTER_NAME: ${RD_BOOTSTRAP_MASTER_NAME:-}
      RD_BOOTSTRAP_MASTER_PASSWORD_FILE: /run/secrets/bootstrap_master_password
    secrets:
      - db_app_password
      - redis_password
      - app_secret_key
      - jwt_secret_key
      - data_encryption_key
      - cloudpaypag_webhook_secret
      - bootstrap_master_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    logging: *default-logging

  # ─── Aplicação ──────────────────────────────────────────────────────────────
  backend:
    build: *backend-build
    image: *backend-image
    pull_policy: build
    restart: unless-stopped
    environment:
      <<: *backend-env
    secrets: *backend-secrets
    configs: *backend-configs
    volumes:
      - media-storage:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully
    networks:
      - internal
      - egress
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  worker:
    build: *backend-build
    image: *backend-image
    pull_policy: build
    restart: unless-stopped
    stop_grace_period: 120s
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=${RD_WORKER_CONCURRENCY:-2} -Q ${RD_CELERY_QUEUES:-default,media,notifications,financial,reports}
    environment:
      <<: *backend-env
    secrets: *backend-secrets
    configs: *backend-configs
    volumes:
      - media-storage:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully
    networks:
      - internal
      - egress
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 2>/dev/null | grep -q pong"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  worker-beat:
    build: *backend-build
    image: *backend-image
    pull_policy: build
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info --scheduler redbeat.RedBeatScheduler
    environment:
      <<: *backend-env
    secrets: *backend-secrets
    configs: *backend-configs
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully
    networks:
      - internal
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.observability", "beat-healthcheck", "--max-age", "180"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ─── Dados ──────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    shm_size: 256m
    environment:
      POSTGRES_DB: ${RD_DB_NAME:-rdmidiaindoor}
      POSTGRES_USER: ${RD_DB_SUPERUSER:-rd_super}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=pt_BR.UTF-8 --lc-ctype=pt_BR.UTF-8"
    secrets:
      - postgres_superuser_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RD_DB_SUPERUSER:-rd_super} -d ${RD_DB_NAME:-rdmidiaindoor}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  redis:
    image: redis:7.4.8-alpine
    restart: unless-stopped
    user: redis
    command: ["sh", "-c", "umask 077; printf 'requirepass %s\\nappendonly yes\\ndir /data\\n' \"$$(cat /run/secrets/redis_password)\" > /tmp/redis.conf && exec redis-server /tmp/redis.conf"]
    secrets:
      - redis_password
    volumes:
      - redis-data:/data
    networks:
      - internal
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  db-init:
    <<: *dbtools
    restart: "no"
    command: ["rd-db-init"]
    environment:
      RD_DB_NAME: ${RD_DB_NAME:-rdmidiaindoor}
      RD_DB_SUPERUSER: ${RD_DB_SUPERUSER:-rd_super}
      RD_DB_SUPERUSER_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      RD_DB_TRANSFER_OWNERSHIP: "on"
    secrets:
      - postgres_superuser_password
      - db_owner_password
      - db_app_password
      - db_backup_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    logging: *default-logging

  db-backup:
    <<: *dbtools
    restart: unless-stopped
    init: true
    command: ["rd-backup-scheduler"]
    environment:
      TZ: America/Sao_Paulo
      RD_DB_NAME: ${RD_DB_NAME:-rdmidiaindoor}
      RD_BACKUP_DB_USER: rd_backup
      RD_BACKUP_DB_PASSWORD_FILE: /run/secrets/db_backup_password
      RD_BACKUP_PASSPHRASE_FILE: /run/secrets/backup_passphrase
      RD_BACKUP_AT: ${RD_BACKUP_AT:-03:00}
      RD_BACKUP_KEEP_DAILY: "7"
      RD_BACKUP_KEEP_WEEKLY: "4"
      RD_BACKUP_KEEP_MONTHLY: "3"
      RD_BACKUP_COUNT_ROWS: ${RD_BACKUP_COUNT_ROWS:-1}
      RD_BACKUP_OFFSITE_CMD: ${RD_BACKUP_OFFSITE_CMD:-}
    secrets:
      - db_backup_password
      - backup_passphrase
    volumes:
      - db-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - internal
      - egress
    logging: *default-logging
    healthcheck:
      test: ["CMD", "rd-backup-healthcheck"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  backup-metrics:
    <<: *dbtools
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=1m
    command: ["rd-backup-metrics"]
    environment:
      TZ: America/Sao_Paulo
      RD_METRICS_PORT: "9101"
      RD_BACKUP_MAX_AGE_H: "26"
      RD_DRILL_MAX_AGE_DAYS: ${RD_DRILL_MAX_AGE_DAYS:-35}
      RD_BACKUP_OFFSITE_REQUIRED: ${RD_BACKUP_OFFSITE_REQUIRED:-false}
    volumes:
      - db-backups:/backups:ro
    networks:
      - internal
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9101/metrics.prom"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 32M

  db-restore:
    <<: *dbtools
    profiles: ["ops"]
    restart: "no"
    command: ["rd-restore-drill"]
    environment:
      TZ: America/Sao_Paulo
      RD_DB_NAME: ${RD_DB_NAME:-rdmidiaindoor}
      RD_DB_SUPERUSER: ${RD_DB_SUPERUSER:-rd_super}
      RD_DB_SUPERUSER_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      RD_BACKUP_PASSPHRASE_FILE: /run/secrets/backup_passphrase
    secrets:
      - postgres_superuser_password
      - backup_passphrase
    volumes:
      - db-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    logging: *default-logging

  # ─── E-mail de DESENVOLVIMENTO (nada sai para a internet) ───────────────────
  mailpit:
    image: axllent/mailpit:v1.28
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
      TZ: America/Sao_Paulo
    volumes:
      - mailpit-data:/data
    ports:
      - "127.0.0.1:${RD_MAILPIT_PORT:-8025}:8025"
    networks:
      - internal
      - local
    logging: *default-logging
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # ─── Observabilidade (mesma da produção) ────────────────────────────────────
  prometheus:
    build:
      context: ./observability/prometheus
    image: rd-midiaindoor/prometheus:${RD_INSTANCE}
    pull_policy: build
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${RD_PROMETHEUS_RETENTION:-7d}
      - --storage.tsdb.retention.size=${RD_PROMETHEUS_RETENTION_SIZE:-2GB}
    volumes:
      - prometheus-data:/prometheus
    networks:
      - internal
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  alertmanager:
    build:
      context: ./observability/alertmanager
    image: rd-midiaindoor/alertmanager:${RD_INSTANCE}
    pull_policy: build
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/rd-instance.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    configs:
      - source: alertmanager_config
        target: /etc/alertmanager/rd-instance.yml
    volumes:
      - alertmanager-data:/alertmanager
    networks:
      - internal
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  loki:
    build:
      context: ./observability/loki
    image: rd-midiaindoor/loki:${RD_INSTANCE}
    pull_policy: build
    restart: unless-stopped
    volumes:
      - loki-data:/loki
    networks:
      - internal
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  promtail:
    build:
      context: ./observability/promtail
    image: rd-midiaindoor/promtail:${RD_INSTANCE}
    pull_policy: build
    restart: unless-stopped
    environment:
      RD_COMPOSE_PROJECT: ${RD_INSTANCE}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/promtail
    networks:
      - internal
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  grafana:
    build:
      context: ./observability/grafana
    image: rd-midiaindoor/grafana:${RD_INSTANCE}
    pull_policy: build
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: America/Sao_Paulo
    secrets:
      - grafana_admin_password
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${RD_GRAFANA_PORT:-3005}:3000"
    networks:
      - internal
      - local
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
