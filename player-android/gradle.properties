org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Hosts de DESENVOLVIMENTO onde HTTP (cleartext) é permitido — somente no build debug.
# Release: HTTPS obrigatório (rd.release.cleartextHosts vazio por padrão).
rd.dev.cleartextHosts=localhost,127.0.0.1,10.0.2.2
rd.release.cleartextHosts=
# URL base padrão da API (vazio = perguntar no primeiro boot). Sem domínio hardcoded.
rd.apiBaseUrl=
# SPKI (base64url) das chaves de release que assinam o app-update (RDPP §8). Formato: keyId=spki;keyId2=spki2
rd.update.publicKeys=
