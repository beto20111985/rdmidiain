# =============================================================================
# RD Mídia Indoor — imagens da APLICAÇÃO do ambiente DEV + deploy por EVENTO (AÇÃO 007)
# -----------------------------------------------------------------------------
# push no branch dev → constrói backend, frontend, player-web (target production) e nginx,
# publica no GHCR (:dev e :sha-<commit>) e, se o segredo existir, chama o webhook da
# stack Swarm "rd-dev-app" no Portainer. O Swarm troca as tarefas uma a uma
# (start-first + healthcheck): sem queda. Nada de polling (decisão do proprietário).
#
# Segredo do repositório (opcional; sem ele só publica as imagens):
#   PORTAINER_WEBHOOK_DEV_APP = URL completa do webhook da stack rd-dev-app
# O Portainer da VPS usa certificado autoassinado → curl -k (URL é o segredo).
# =============================================================================
name: dev-images

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: dev-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/rdmidiain

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { image: backend,    target: production }
          - { image: frontend,   target: production }
          - { image: player-web, target: production }
          - { image: nginx,      target: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          target: ${{ matrix.target }}
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:dev
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=rd-midiaindoor-${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Disparar redeploy da stack rd-dev-app (Portainer)
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_DEV_APP }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::PORTAINER_WEBHOOK_DEV_APP não configurado — imagens publicadas, deploy não disparado."
            exit 0
          fi
          code=$(curl -sk -o /dev/null -w '%{http_code}' -X POST --max-time 60 "$WEBHOOK")
          echo "webhook HTTP $code"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
