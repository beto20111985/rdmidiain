# =============================================================================
# RD Mídia Indoor — Prometheus (uma instância por stack/instância white-label)
# Raspa os alvos pela rede interna docker (rd-internal). O /metrics do backend
# NÃO passa pelo nginx (a borda nega /metrics).
# =============================================================================
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: rd-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: backend

  # Backup/restore drill: sidecar backup-metrics (arquivo de texto servido pelo
  # httpd do busybox; só metadados, sem segredos)
  - job_name: rd-backup
    scrape_interval: 60s
    metrics_path: /metrics.prom
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: ["backup-metrics:9101"]
        labels:
          service: db-backup

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: promtail
    static_configs:
      - targets: ["promtail:9080"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
