# =============================================================================
# RD Mídia Indoor — Promtail: coleta SOMENTE os containers do projeto compose
# (label com.docker.compose.project=${RD_COMPOSE_PROJECT}) via Docker API e envia
# ao Loki. Redige segredos ANTES do envio (tokens em query string, Bearer, campos
# JSON sensíveis) — defesa em profundidade para logs de uvicorn/nginx/workers.
# Executado com -config.expand-env=true.
# ATENÇÃO: Promtail está em fim de vida (EOL 2026-03-02); sucessor oficial é o
# Grafana Alloy (ver ops/README.md — pendência de migração).
# =============================================================================
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 2s
    batchsize: 1048576

scrape_configs:
  - job_name: rd-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.project=${RD_COMPOSE_PROJECT}"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: compose_service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: project
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
    pipeline_stages:
      # 1) parâmetros sensíveis em URLs/query strings: ?token=…, &ticket=…, code=…
      - replace:
          expression: '(?i)(?:^|[?&;\s"''])(?:access_token|refresh_token|id_token|token|ticket|secret|device_secret|password|passwd|pwd|signature|sig|code|otp|totp|api_key|apikey)=([^&\s"'';]+)'
          replace: "[REDACTED]"
      # 2) Authorization: Bearer <token>
      - replace:
          expression: '(?i)bearer\s+([A-Za-z0-9\-\._~\+/]+=*)'
          replace: "[REDACTED]"
      # 3) campos JSON sensíveis: "password": "…", "token": "…"
      - replace:
          expression: '(?i)"(?:password|new_password|current_password|token|access_token|refresh_token|mfa_token|secret|device_secret|totp_secret|pix_key|signature)"\s*:\s*"([^"]*)"'
          replace: "[REDACTED]"
      # 4) URLs de conexão com senha: scheme://user:SENHA@host
      - replace:
          expression: '[a-z][a-z0-9+.\-]*://[^:/\s@]*:([^@\s/]+)@'
          replace: "[REDACTED]"
