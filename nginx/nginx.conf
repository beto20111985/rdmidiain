# =============================================================================
# RD Mídia Indoor — nginx.conf (comum a LOCAL e PRODUÇÃO)
# -----------------------------------------------------------------------------
# - Local:    conf.d/local.conf            (montado pelo docker-compose.yml)
# - Produção: prod/templates/*.template    (embutido na imagem nginx/Dockerfile,
#                                           renderizado por envsubst no start)
# - Headers de segurança: snippets/headers-*.conf, incluídos em TODO server que
#   use add_header. Regra de ouro: NUNCA usar add_header dentro de location sem
#   incluir de novo o snippet do server (herança do nginx: um add_header no nível
#   filho descarta TODOS os add_header do nível pai).
# - Logs: JSON, SEM query string ($uri, nunca $request/$args/$request_uri) e sem
#   headers de autorização/cookies. Referer é registrado sem query string.
# =============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

# stderr → docker logs → promtail → Loki
error_log /dev/stderr warn;

events {
    # players mantêm 1 WebSocket cada (meta: 10.000 telas por instância)
    worker_connections 8192;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset      utf-8;

    server_tokens off;

    # ─── Upgrade de conexão (WebSocket / Vite HMR) mantendo keepalive ─────────
    # Com Upgrade → "upgrade"; sem Upgrade → "" (header omitido → keepalive HTTP/1.1
    # com o upstream continua funcionando).
    map $http_upgrade $connection_upgrade_keepalive {
        default upgrade;
        ""      "";
    }

    # ─── Referer sem query string (pode carregar tokens de terceiros) ────────
    map $http_referer $referer_noquery {
        "~^(?<rd_ref_base>[^?#]*)" $rd_ref_base;
        default                    "";
    }

    # ─── Chave do rate limit de dispositivo ──────────────────────────────────
    # Player autentica com "Authorization: Bearer <JWT de device>" (RDPP/1).
    # Sem header → cai para o IP (chave vazia NÃO é limitada pelo nginx, por isso
    # o fallback é obrigatório). Para impedir burla girando headers aleatórios,
    # as rotas de player também passam pela zona por IP rl_player_ip.
    map $http_authorization $rl_device_key {
        ""      $binary_remote_addr;
        default $http_authorization;
    }

    # ─── Log JSON sem query string ───────────────────────────────────────────
    log_format rd_json escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id",'
        '"host":"$host",'
        '"server_port":"$server_port",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"protocol":"$server_protocol",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"limit_req_status":"$limit_req_status",'
        '"referer":"$referer_noquery",'
        '"user_agent":"$http_user_agent"}';

    access_log /dev/stdout rd_json;

    # ─── Transporte ──────────────────────────────────────────────────────────
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    types_hash_max_size 2048;

    # Corpo padrão pequeno; a rota de upload sobe para 210m (snippets/loc-admin-api.conf)
    client_max_body_size        10m;
    client_body_buffer_size     128k;
    client_header_timeout       15s;
    client_body_timeout         60s;
    send_timeout                60s;
    large_client_header_buffers 4 16k;

    proxy_buffer_size        16k;
    proxy_buffers            16 16k;
    proxy_busy_buffers_size  32k;
    # Timeouts padrão de proxy (WS, upload e mídia sobrescrevem por location)
    proxy_connect_timeout    5s;
    proxy_send_timeout       60s;
    proxy_read_timeout       60s;

    # ─── Rate limiting (sempre 429, nunca 503) ───────────────────────────────
    limit_req_status     429;
    limit_conn_status    429;
    # "info" < nível do error_log (warn): rejeições NÃO vão ao error log, que
    # incluiria a linha de requisição COM query string. Elas ficam no access log
    # JSON (status 429 + limit_req_status=REJECTED, sem query string).
    limit_req_log_level  info;
    limit_conn_log_level info;

    # Login e rotas públicas sensíveis: por IP, restrito (anti brute force)
    limit_req_zone $binary_remote_addr zone=rl_login:10m     rate=10r/m;
    # refresh / me / sessões / ticket WS: por IP, folgado (escritórios atrás de NAT)
    limit_req_zone $binary_remote_addr zone=rl_session:10m   rate=120r/m;
    # API geral do painel: por IP
    limit_req_zone $binary_remote_addr zone=rl_api:20m       rate=20r/s;
    # Upload de mídia: por IP
    limit_req_zone $binary_remote_addr zone=rl_upload:10m    rate=10r/m;
    # Handshake de WebSocket: por IP (tempestade de reconexão)
    limit_req_zone $binary_remote_addr zone=rl_ws:10m        rate=60r/m;
    # Player: por dispositivo (Bearer) com fallback IP + teto por IP (NAT com muitas telas)
    limit_req_zone $rl_device_key      zone=rl_device:20m    rate=120r/m;
    limit_req_zone $binary_remote_addr zone=rl_player_ip:20m rate=50r/s;
    # Pareamento / challenge / token do player (rotas sem autenticação): por IP
    limit_req_zone $binary_remote_addr zone=rl_pairing:10m   rate=20r/m;
    # Conexões simultâneas por IP
    limit_conn_zone $binary_remote_addr zone=cl_ip:10m;

    # ─── Compressão (mídia NÃO entra: vídeo/imagem não estão em gzip_types) ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               text/javascript application/xml application/rss+xml image/svg+xml
               application/manifest+json;

    include /etc/nginx/conf.d/*.conf;
}
