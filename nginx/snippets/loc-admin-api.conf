# =============================================================================
# API e WebSocket do PAINEL (contrato docs/contracts/API_CONVENCOES_AUTH_RBAC_REALTIME_v1.md).
# Ordem de seleção do nginx: "=" exato → maior prefixo "^~" → regex (na ordem) →
# maior prefixo comum. /api/ é prefixo comum para que as regex abaixo vençam.
# Requer: upstream rd_backend, snippets/proxy-common.conf, zonas do nginx.conf.
# =============================================================================

# Login e rotas públicas sensíveis — por IP, restrito (10 r/min, rajada 5)
location = /api/v1/auth/login {
    limit_req zone=rl_login burst=5 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://rd_backend;
}
location ~ ^/api/v1/auth/(mfa/verify|password/forgot|password/reset|invites/accept)$ {
    limit_req zone=rl_login burst=5 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://rd_backend;
}

# Sessão (refresh/logout/sessões/me/ticket WS) — folgado: não derrubar sessões
# de vários usuários atrás do mesmo NAT
location ~ ^/api/v1/(auth/(refresh|logout|logout-all|sessions)|me|users/me|realtime/ticket)(/|$) {
    limit_req zone=rl_session burst=60 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://rd_backend;
}

# Upload de mídia (vídeo até 200 MB + overhead multipart): streaming para o
# backend sem bufferizar o corpo em disco no nginx. Qualquer rota com segmento
# /upload ou /uploads (ex.: /api/v1/media/upload) cai aqui.
location ~ ^/api/v1/.+/uploads?(/|$) {
    limit_req zone=rl_upload burst=5 nodelay;
    client_max_body_size    210m;
    client_body_timeout     120s;
    proxy_request_buffering off;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_pass http://rd_backend;
}

# API geral
location /api/ {
    limit_req zone=rl_api burst=100 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://rd_backend;
}

# WebSocket do painel (/ws/admin?ticket=…) e demais /ws/* que não sejam de player
location /ws/ {
    limit_req  zone=rl_ws burst=60 nodelay;
    limit_conn cl_ip 50;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_buffering    off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://rd_backend;
}
