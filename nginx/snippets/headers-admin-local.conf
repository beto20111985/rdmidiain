# =============================================================================
# Painel administrativo — LOCAL (HTTP, Vite dev). SEM HSTS.
# CSP RELAXADA SOMENTE EM LOCAL, pelos motivos abaixo (produção: headers-admin-prod.conf):
#   - script-src 'unsafe-inline': preâmbulo inline do React Fast Refresh que o
#     @vitejs/plugin-react injeta no index.html em modo dev;
#   - style-src  'unsafe-inline': o Vite dev injeta CSS como <style> via JS (HMR);
#   - connect-src ws://localhost:* ws://127.0.0.1:*: WebSocket do HMR do Vite;
#     wss://$host: HMR e /ws/admin quando o painel é aberto por túnel https de
#     desenvolvimento (host já autorizado pelo Vite; mesmo padrão da produção).
# Google Fonts: usado hoje por frontend/index.html (recomendado self-host).
# =============================================================================
include /etc/nginx/snippets/security-headers-base.conf;
# Painel: geolocalização só na própria origem (botão "Usar GPS" do cadastro de telas/estabelecimentos)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws://localhost:* ws://127.0.0.1:* wss://$host; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
