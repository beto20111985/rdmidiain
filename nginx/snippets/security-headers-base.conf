# =============================================================================
# Headers de segurança comuns (LOCAL e PRODUÇÃO). NÃO incluir diretamente num
# server: inclua um dos snippets headers-<app>-<ambiente>.conf, que já incluem
# este arquivo + Referrer-Policy + CSP (+ HSTS em produção).
# Herança do nginx: se uma location usar add_header, ela precisa incluir de novo
# o snippet headers-* do seu server (senão perde todos os headers abaixo).
# =============================================================================
add_header X-Content-Type-Options            "nosniff"     always;
add_header X-Frame-Options                   "DENY"        always;
add_header Cross-Origin-Opener-Policy        "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none"        always;
# Obsoleto; "0" desliga o auditor legado (recomendação OWASP)
add_header X-XSS-Protection                  "0"           always;
# Permissions-Policy é definida em cada headers-<app>-<ambiente>.conf (o painel precisa
# de geolocation=(self) para o botão "Usar GPS"; player/docs mantêm tudo desligado).
