# =============================================================================
# Listener interno do próprio container (127.0.0.1:8081) — usado pelo healthcheck.
# Não é publicado nem alcançável pela rede docker (bind em loopback).
# Incluir no contexto http (topo de conf.d/local.conf e do template de produção).
# =============================================================================
server {
    listen 127.0.0.1:8081;
    server_name _;
    access_log off;
    location = /nginx-health { default_type text/plain; return 200 "ok\n"; }
    location = /stub_status  { stub_status; }
    location /               { return 404; }
}
