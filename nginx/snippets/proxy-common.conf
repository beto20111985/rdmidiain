# =============================================================================
# Proxy comum. Incluir em TODA location com proxy_pass (proxy_set_header também
# sofre a regra de herança: definir um no filho descarta os do pai).
# Timeouts padrão ficam no nginx.conf (http) e são sobrescritos por location.
# =============================================================================
proxy_http_version 1.1;
proxy_set_header Host              $host;
# Borda: nunca confiar em X-Forwarded-For enviado pelo cliente (anti-spoof) — a lista é
# SOBRESCRITA com $remote_addr. Produção: $remote_addr = par TCP (sem real_ip). Local:
# real_ip só a partir da rede Docker (conf.d/local.conf), para o túnel de desenvolvimento.
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
# $rd_forwarded_proto / $rd_forwarded_port são definidos POR AMBIENTE:
#   produção (prod/templates/rd.conf.template): = $scheme / $server_port (este nginx é a borda TLS);
#   local (conf.d/local.conf): último X-Forwarded-Proto SOMENTE de proxy confiável, senão $scheme.
# X-Forwarded-Host é sempre o $host desta conexão (nunca o X-Forwarded-Host do cliente).
proxy_set_header X-Forwarded-Proto $rd_forwarded_proto;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $rd_forwarded_port;
proxy_set_header X-Request-ID      $request_id;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade_keepalive;
# Headers de segurança vêm SÓ da borda (evita duplicidade/conflito com upstream).
# X-Server-Time-Ms, ETag, Content-Range, Accept-Ranges etc. passam intactos.
proxy_hide_header X-Powered-By;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-XSS-Protection;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header X-Permitted-Cross-Domain-Policies;
