# =============================================================================
# API e WebSocket dos PLAYERS (protocolo RDPP/1 — protocol/RD_PLAYER_PROTOCOL_v1.md).
# Incluído no server do painel (players nativos podem usar o host da API) e no
# server do Player Web (origem própria). Players usam SOMENTE:
#   /api/v1/player/**   (pareamento, auth, manifesto, mídia, eventos, ws-ticket, anchor, app-update)
#   /ws/player e /ws/player/pairing
# Rate limit: por dispositivo (Bearer; fallback IP) + teto por IP (NAT com muitas telas).
# Requer: upstream rd_backend, snippets/proxy-common.conf, zonas do nginx.conf.
# =============================================================================
location ^~ /api/v1/player/ {
    limit_req zone=rl_player_ip burst=200 nodelay;
    limit_req zone=rl_device    burst=60  nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://rd_backend;

    # Claim pelo técnico no dispositivo (login+senha+TOTP) → mesma régua do login
    location ~ ^/api/v1/player/pairing/requests/[^/]+/claim$ {
        limit_req zone=rl_login burst=5 nodelay;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://rd_backend;
    }

    # Pareamento / challenge / token: rotas sem Bearer → limite por IP
    location ~ ^/api/v1/player/(pairing/requests|auth/challenge|auth/token)(/|$) {
        limit_req zone=rl_player_ip burst=200 nodelay;
        limit_req zone=rl_pairing   burst=20  nodelay;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://rd_backend;
    }

    # Mídia (até 200 MB): Range/If-Range repassados, resposta sem buffer em disco
    # (streaming direto), timeouts longos para links lentos de TV Box.
    location ~ ^/api/v1/player/media/ {
        limit_req zone=rl_player_ip burst=200 nodelay;
        limit_req zone=rl_device    burst=60  nodelay;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Range    $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        send_timeout       300s;
        proxy_pass http://rd_backend;
    }
}

# WebSocket do player (/ws/player?ticket=… e /ws/player/pairing?request_id=…)
location ^~ /ws/player {
    limit_req  zone=rl_ws burst=120 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_buffering    off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://rd_backend;
}
