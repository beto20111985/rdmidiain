# =============================================================================
# Health/metrics (painel e player). /health e /health/ready vão ao BACKEND (nunca
# ao SPA). Demais /health/* (ex.: /health/full, que expõe detalhes) e /metrics são
# NEGADOS na borda: Prometheus raspa backend:8000/metrics direto pela rede interna
# docker (rd-internal), sem passar pelo nginx.
# Requer: upstream rd_backend e snippets/proxy-common.conf.
# =============================================================================
location = /health {
    access_log off;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://rd_backend;
}

location = /health/ready {
    access_log off;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://rd_backend;
}

location ^~ /health/ {
    deny all;
}

location = /metrics {
    deny all;
}
