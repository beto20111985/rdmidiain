# =============================================================================
# Player Web — LOCAL (origem própria http://localhost:8088, simula player.<dominio>).
# CSP do bundle do player (A4 §9.2 + coordenação AÇÃO 002) com SÓ estes
# relaxamentos de desenvolvimento (produção: headers-player-prod.conf):
#   - style-src 'unsafe-inline': o Vite dev injeta CSS como <style> (HMR);
#   - connect-src ws://localhost:8088: WebSocket do HMR do Vite (produção:
#     wss://player.<dominio>, i.e. wss://$host); wss://$host também em local para o
#     player aberto por túnel https de desenvolvimento (host autorizado pelo Vite).
# Trusted Types continua APLICADO em local (paridade com produção). Efeito
# colateral conhecido: o overlay de erro do Vite (innerHTML) pode ser bloqueado;
# o erro continua visível no console.
# localhost é "contexto seguro": WebCrypto/Service Worker/OPFS funcionam em HTTP local.
# =============================================================================
include /etc/nginx/snippets/security-headers-base.conf;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' ws://localhost:8088 wss://$host; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types rd-player" always;
