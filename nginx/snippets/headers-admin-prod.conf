# =============================================================================
# Painel administrativo — PRODUÇÃO (HTTPS). HSTS somente aqui (nunca em local).
# connect-src: 'self' cobre https/wss do mesmo host (CSP3); wss://$host explícito
# para navegadores antigos ($host = server_name validado pelo server block).
# script-src estrito ('self'). style-src 'unsafe-inline' mantido até validação em
# navegador do build de produção (pendência registrada no relatório W-INFRA).
# =============================================================================
include /etc/nginx/snippets/security-headers-base.conf;
# Painel: geolocalização só na própria origem (botão "Usar GPS" do cadastro de telas/estabelecimentos)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss://$host; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
