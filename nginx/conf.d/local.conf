# =============================================================================
# RD Mídia Indoor — nginx LOCAL (desenvolvimento em Docker Desktop)
# -----------------------------------------------------------------------------
#  :80   → painel (Vite dev do frontend + /api + /ws + /health)     http://localhost
#  :8088 → Player Web (origem própria, simula player.<dominio>)      http://localhost:8088
# HTTP sem TLS e SEM HSTS (HSTS só existe em produção, prod/templates/).
# Produção: nginx/prod/templates/rd.conf.template (imagem nginx/Dockerfile).
# Este arquivo NÃO entra na imagem de produção.
# =============================================================================

# DNS interno do Docker; "resolve" nos upstreams acompanha troca de IP quando um
# container é recriado (sem precisar recarregar o nginx) e permite subir o nginx
# mesmo se um upstream ainda não existir (nginx >= 1.27.3).
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# ─── Proxy confiável (SOMENTE LOCAL) — túnel de desenvolvimento (ex.: ngrok) ──
# No Docker Desktop TODA conexão vinda do host Windows — navegador local, agente do
# túnel (https://<túnel> → http://localhost:80 ou :8088) e, se o firewall permitir, a
# LAN — chega aqui com o IP do GATEWAY da rede Docker (faixas privadas abaixo, ex.:
# 192.168.0.1 em rd-external). Só desses pares TCP aceitamos X-Forwarded-For/-Proto.
# Comportamento do ngrok MEDIDO (AÇÃO 003): ACRESCENTA o IP do cliente ao FIM de
# X-Forwarded-For e "https" ao FIM de X-Forwarded-Proto, preservando à esquerda o que o
# cliente enviou; repassa X-Forwarded-Host/-Port do cliente SEM alterar. Logo:
#   - IP real  = último elemento não confiável de X-Forwarded-For (real_ip_recursive);
#   - esquema  = SOMENTE o último elemento de X-Forwarded-Proto ("http"|"https");
#   - X-Forwarded-Host/-Port do cliente NUNCA são aceitos ($host — já validado pelo
#     Vite/allowlists — e porta derivada do esquema).
# Produção NÃO usa nada disto: lá este nginx É a borda TLS (prod/templates/rd.conf.template).
set_real_ip_from  127.0.0.1;
set_real_ip_from  172.16.0.0/12;
set_real_ip_from  192.168.0.0/16;
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

geo $realip_remote_addr $rd_trusted_proxy {
    default        0;
    127.0.0.1/32   1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
}

# Variáveis usadas por snippets/proxy-common.conf (definidas por ambiente).
map "$rd_trusted_proxy:$http_x_forwarded_proto" $rd_forwarded_proto {
    default                                     $scheme;
    "~^1:(?:[^,]*,)*\s*(?<rd_xfp>https?)\s*$"   $rd_xfp;
}
map $rd_forwarded_proto $rd_forwarded_port {
    default $server_port;
    https   443;
}

upstream rd_backend {
    zone rd_backend 64k;
    server backend:8000 resolve;
    keepalive 32;
}

upstream rd_frontend {
    zone rd_frontend 64k;
    server frontend:5173 resolve;
    keepalive 16;
}

upstream rd_player_web {
    zone rd_player_web 64k;
    server player-web:5174 resolve;
    keepalive 16;
}

include /etc/nginx/snippets/internal-status.conf;

# ─────────────────────────────────────────────────────────────────────────────
# PAINEL — http://localhost
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost _;

    include /etc/nginx/snippets/headers-admin-local.conf;

    limit_conn cl_ip 300;
    error_page 429             = @rd_429;
    error_page 502 503 504     = @rd_unavailable;

    include /etc/nginx/snippets/loc-health.conf;
    include /etc/nginx/snippets/loc-player-api.conf;
    include /etc/nginx/snippets/loc-admin-api.conf;

    # OpenAPI / Swagger / ReDoc — SOMENTE LOCAL (produção: 404). Contrato: /api/v1/docs
    # e /api/v1/openapi.json; /docs mantido por compatibilidade.
    location ~ ^(/api/v1)?/(docs|redoc)(/|$) {
        limit_req zone=rl_api burst=100 nodelay;
        include /etc/nginx/snippets/headers-docs-local.conf;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://rd_backend;
    }
    location = /openapi.json {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://rd_backend;
    }

    # Painel (Vite dev). HMR usa WebSocket no mesmo host/porta → Upgrade repassado.
    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://rd_frontend;
    }

    location @rd_429 {
        include /etc/nginx/snippets/headers-admin-local.conf;
        add_header Retry-After "60" always;
        default_type application/json;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Muitas requisições. Aguarde alguns instantes e tente novamente.","details":{}}}';
    }
    location @rd_unavailable {
        include /etc/nginx/snippets/headers-admin-local.conf;
        add_header Retry-After "10" always;
        default_type application/json;
        return 503 '{"error":{"code":"UPSTREAM_UNAVAILABLE","message":"Serviço temporariamente indisponível.","details":{}}}';
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# PLAYER WEB — http://localhost:8088 (origem separada do painel: isola storage,
# CSP estrita própria). Só rotas de player são expostas nesta origem.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 8088;
    listen [::]:8088;
    server_name localhost _;

    include /etc/nginx/snippets/headers-player-local.conf;

    limit_conn cl_ip 300;
    error_page 429             = @rd_429;
    error_page 502 503 504     = @rd_unavailable;

    include /etc/nginx/snippets/loc-health.conf;
    include /etc/nginx/snippets/loc-player-api.conf;

    # Nada além de /api/v1/player/** e /ws/player* nesta origem
    location ^~ /api/ {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"Rota inexistente nesta origem.","details":{}}}';
    }
    location ^~ /ws/ {
        return 404;
    }
    location ~ ^/(docs|redoc|openapi\.json)(/|$) {
        return 404;
    }

    # App do Player Web (Vite dev + HMR)
    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://rd_player_web;
    }

    location @rd_429 {
        include /etc/nginx/snippets/headers-player-local.conf;
        add_header Retry-After "60" always;
        default_type application/json;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Muitas requisições. Aguarde alguns instantes e tente novamente.","details":{}}}';
    }
    location @rd_unavailable {
        include /etc/nginx/snippets/headers-player-local.conf;
        add_header Retry-After "10" always;
        default_type application/json;
        return 503 '{"error":{"code":"UPSTREAM_UNAVAILABLE","message":"Serviço temporariamente indisponível.","details":{}}}';
    }
}
