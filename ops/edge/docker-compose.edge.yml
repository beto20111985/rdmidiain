# =============================================================================
# RD Mídia Indoor — BORDA TLS COMPARTILHADA DA VPS (Traefik) — AÇÃO 005
# -----------------------------------------------------------------------------
# UMA por VPS. Termina o TLS de todas as instâncias do host (dev, dev-teste, …),
# emite/renova certificados Let's Encrypt (HTTP-01) e encaminha HTTP para o nginx
# de cada instância pela rede ${RD_EDGE_NETWORK}. O Traefik tem IP FIXO nessa rede
# (RD_EDGE_TRAEFIK_IP): é o único par confiável para X-Forwarded-* no nginx das
# instâncias (RD_TRUSTED_PROXY_CIDR=<ip>/32).
#
# A API do Docker NÃO é montada no Traefik (exposto à internet): ele lê só a lista de
# containers/eventos por um socket-proxy somente leitura numa rede interna própria.
#
# Cada instância se registra por labels no CONTAINER do próprio nginx (docker-compose.dev-app.yml,
# serviço Swarm): o provider docker do Traefik segue os EVENTOS do Docker (sem polling) e só
# roteia para containers saudáveis. Requer `docker swarm init` (rede overlay).
# Nada de painel/dashboard do Traefik exposto. Portainer → Stack "rd-edge" (Git) ou:
#   docker compose -f ops/edge/docker-compose.edge.yml -p rd-edge up -d
# Procedimento: ops/README.md §12.
# =============================================================================

name: rd-edge

networks:
  # Overlay ATTACHABLE (AÇÃO 007): o nginx das instâncias roda como serviço Swarm e
  # entra nesta rede. IPs dinâmicos SÓ na metade alta (ip_range): o IP fixo do Traefik
  # (10.250.0.2) nunca é entregue a outro container (o único proxy confiável).
  edge:
    name: ${RD_EDGE_NETWORK:-rd-edge}
    driver: overlay
    attachable: true
    ipam:
      config:
        - subnet: ${RD_EDGE_SUBNET:-10.250.0.0/24}
          ip_range: ${RD_EDGE_IP_RANGE:-10.250.0.128/25}
  docker-api:
    driver: bridge
    internal: true

volumes:
  letsencrypt:

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:${RD_SOCKET_PROXY_VERSION:-v0.4.2}
    restart: unless-stopped
    environment:
      # Somente leitura do necessário ao provider Docker do Traefik.
      CONTAINERS: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  traefik:
    image: traefik:${RD_TRAEFIK_VERSION:-v3.7.16}
    restart: unless-stopped
    depends_on:
      - socket-proxy
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=INFO
      # Log de acesso JSON (sem cabeçalhos: nada de cookies/tokens); mostra o servidor escolhido
      # e as tentativas do retry — diagnóstico de deploy sem queda (AÇÃO 007).
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.fields.headers.defaultmode=drop
      - --ping=true
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${RD_EDGE_NETWORK:-rd-edge}
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      # Cabeçalhos que "apelidam" outros (X_Forwarded_For, X.Forwarded.For) são descartados:
      # impede forjar os X-Forwarded-* gerados pela borda em backends que normalizam nomes.
      - --entrypoints.web.http.aliasheadersstrategy=delete
      - --entrypoints.websecure.http.aliasheadersstrategy=delete
      # Uploads de vídeo de até 210 MB (600 s no nginx). WebSocket já estabelecido não
      # é afetado por este limite de leitura da requisição.
      # Deploy sem queda (medido na AÇÃO 007): aplica eventos do Docker sem o atraso padrão de
      # 2 s e desiste rápido de um container que acabou de sair (o retry da instância refaz a
      # requisição no container novo). Padrão: 1 falha por troca; ajustado: 0 em 482 requisições.
      - --providers.providersthrottleduration=0s
      - --serverstransport.forwardingtimeouts.dialtimeout=500ms
      - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=900s
      - --entrypoints.websecure.transport.respondingtimeouts.idletimeout=180s
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/letsencrypt
    networks:
      edge:
        ipv4_address: ${RD_EDGE_TRAEFIK_IP:-10.250.0.2}
      docker-api: {}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
