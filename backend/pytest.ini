[pytest]
# AÇÃO 002 / W1: suíte contra PostgreSQL e Redis REAIS (ver tests/conftest.py).
# Cobertura NÃO é critério de aceite (removido --cov-fail-under); para medir:
#   pytest --cov=app --cov-report=term-missing
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    -q
    -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    unit: testes isolados, sem banco/HTTP
    integration: testes com PostgreSQL/Redis reais e HTTP (ASGI)
    concurrency: testes com transações concorrentes reais
    adversarial: ataques (injeção, IDOR, escalonamento, replay)
    migrations: upgrade/downgrade/drift em bancos descartáveis
    workers: tasks Celery executadas no processo
    e2e: fluxos ponta a ponta
    slow: testes que levam mais de 5 s
